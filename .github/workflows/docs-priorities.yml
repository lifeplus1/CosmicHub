name: Docs Priorities Index & Snapshot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 6 * * 1'  # Weekly Monday 06:30 UTC (after freshness job)
  workflow_dispatch:

jobs:
  priorities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      - name: Generate Active Priorities Index
        run: |
          python scripts/generate_active_priorities_index.py || (echo 'Index generation failed' && exit 1)
      - name: Update Priorities Snapshot
        run: |
          python scripts/update_priorities_snapshot.py
      - name: Commit updates
        run: |
          if git diff --quiet docs/02-ACTIVE-PRIORITIES/INDEX.md docs/01-CURRENT-STATUS/PROJECT_PRIORITIES_2025.md; then
            echo 'No doc changes to commit.'; exit 0; fi
          git config user.name 'ci-doc-bot'
          git config user.email 'ci-doc-bot@example.com'
          git add docs/02-ACTIVE-PRIORITIES/INDEX.md docs/01-CURRENT-STATUS/PROJECT_PRIORITIES_2025.md || true
          git commit -m 'chore(docs): refresh priorities index & executive snapshot'
          git push || echo 'Push failed (race condition?)'
