<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="healingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with healing gradient -->
  <circle cx="16" cy="16" r="15" fill="url(#healingGradient)" stroke="#ffffff" stroke-width="0.5" opacity="0.95"/>
  
  <!-- Sound waves - representing frequency therapy -->
  <path d="M6 16 Q11 10, 16 16 T26 16" fill="none" stroke="url(#waveGradient)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M8 16 Q12 12, 16 16 T24 16" fill="none" stroke="url(#waveGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M10 16 Q13 14, 16 16 T22 16" fill="none" stroke="url(#waveGradient)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Central healing symbol - subtle cross/plus for wellness -->
  <circle cx="16" cy="16" r="3" fill="#ffffff" opacity="0.9"/>
  <path d="M16 14 L16 18 M14 16 L18 16" stroke="url(#healingGradient)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
