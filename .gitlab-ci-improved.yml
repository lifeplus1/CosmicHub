# Enhanced GitLab CI/CD for CosmicHub monorepo
# Follows modern CI/CD best practices with optimized performance, security, and reliability

stages:
  - prepare
  - validate
  - test
  - security
  - build
  - deploy
  - post-deploy

# Global variables - organized and documented
variables:
  # Runtime versions
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  PNPM_VERSION: "8.15.0"
  
  # Performance optimizations
  NODE_OPTIONS: "--max-old-space-size=4096"
  PNPM_CACHE_FOLDER: ".pnpm-store"
  PIP_CACHE_DIR: ".pip-cache"
  
  # CI optimizations
  GIT_DEPTH: "50"
  GIT_STRATEGY: fetch
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  
  # Security
  SECURE_ANALYZERS_PREFIX: "registry.gitlab.com/security-products/analyzers"
  
  # Deployment URLs
  VITE_BACKEND_URL: "https://astrology-app-0emh.onrender.com"
  ASTRO_PROD_URL: "https://cosmichub-astro.vercel.app"

# Enhanced caching strategy with multiple layers
.cache-config: &cache-config
  cache:
    key: 
      files:
        - package.json
        - pnpm-lock.yaml
        - backend/requirements.txt
    paths:
      - .pnpm-store/
      - .pip-cache/
      - backend/.venv/
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    policy: pull-push
    when: always

# Base configuration for Node.js jobs
.node-base:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git python3 make g++
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir ${PNPM_CACHE_FOLDER}
    - pnpm install --frozen-lockfile --prefer-offline
  <<: *cache-config

# Base configuration for Python jobs
.python-base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl
    - cd backend
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip setuptools wheel
    - pip install --cache-dir ../${PIP_CACHE_DIR} -r requirements.txt
  <<: *cache-config

# Rules for different pipeline triggers
.rules-mr-and-main: &rules-mr-and-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.rules-main-only: &rules-main-only
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.rules-mr-only: &rules-mr-only
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==============================================================================
# PREPARE STAGE - Setup and dependency installation
# ==============================================================================

install-dependencies:
  extends: .node-base
  stage: prepare
  script:
    - echo "🔧 Installing dependencies..."
    - pnpm install --frozen-lockfile
    - echo "📦 Installing package dependencies..."
    - |
      for dir in packages/*; do
        if [ -f "$dir/package.json" ]; then
          echo "Installing deps in $dir"
          (cd "$dir" && pnpm install --frozen-lockfile)
        fi
      done
    - echo "✅ Dependencies installed successfully"
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
      - .pnpm-store/
    expire_in: 1 hour
  <<: *rules-mr-and-main

# ==============================================================================
# VALIDATE STAGE - Code quality, linting, and type checking
# ==============================================================================

validate-project-structure:
  extends: .node-base
  stage: validate
  needs: ["install-dependencies"]
  script:
    - echo "🔍 Validating project structure..."
    # Core directory structure
    - test -d apps/astro/src || { echo "❌ Astro frontend missing"; exit 1; }
    - test -d apps/healwave/src || { echo "❌ HealWave frontend missing"; exit 1; }
    - test -d backend/api || { echo "❌ Backend API missing"; exit 1; }
    - test -d packages || { echo "❌ Packages directory missing"; exit 1; }
    
    # Configuration files
    - test -f eslint.config.js || { echo "❌ ESLint config missing"; exit 1; }
    - test -f .prettierrc || { echo "❌ Prettier config missing"; exit 1; }
    - test -f vitest.workspace.ts || { echo "❌ Vitest workspace missing"; exit 1; }
    - test -f pnpm-workspace.yaml || { echo "❌ PNPM workspace missing"; exit 1; }
    
    # Package.json validation
    - node -e "const pkg = require('./package.json'); if (!pkg.workspaces) throw new Error('Workspaces not configured')"
    - echo "✅ Project structure validated"
  <<: *rules-mr-and-main

lint-frontend:
  extends: .node-base
  stage: validate
  needs: ["install-dependencies"]
  script:
    - echo "🔍 Linting frontend code..."
    - pnpm run lint:core
    - echo "🔒 Running lint ratchet..."
    - pnpm run lint:ratchet
    - echo "✅ Frontend linting passed"
  artifacts:
    reports:
      junit: lint-results.xml
    paths:
      - lint-results.xml
    expire_in: 1 week
    when: always
  <<: *rules-mr-and-main

lint-backend:
  extends: .python-base
  stage: validate
  script:
    - echo "🔍 Linting backend code..."
    - source .venv/bin/activate
    
    # Install linting tools
    - pip install flake8 black isort mypy bandit safety
    
    # Run linting checks
    - echo "Running flake8..."
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --format=junit-xml --output-file=../flake8-junit.xml
    
    - echo "Running black..."
    - black --check --diff .
    
    - echo "Running isort..."
    - isort --check-only --diff .
    
    - echo "Running mypy..."
    - mypy . --ignore-missing-imports --no-strict-optional --junit-xml=../mypy-junit.xml || echo "MyPy warnings found"
    
    - echo "✅ Backend linting passed"
  artifacts:
    reports:
      junit: 
        - flake8-junit.xml
        - mypy-junit.xml
    expire_in: 1 week
    when: always
  <<: *rules-mr-and-main

type-check:
  extends: .node-base
  stage: validate
  needs: ["install-dependencies"]
  script:
    - echo "🔍 Running TypeScript type checks..."
    - echo "Main type check..."
    - pnpm run type-check > type-check.log 2>&1 || TYPECHECK_EXIT=$?
    
    - echo "Package test type checks..."
    - pnpm run type-check:tests > type-check-tests.log 2>&1 || TEST_TYPECHECK_EXIT=$?
    
    - echo "Type error ratchet..."
    - pnpm run type-check:ratchet || RATCHET_EXIT=$?
    
    # Show results
    - cat type-check.log | tail -n 40
    - cat type-check-tests.log | tail -n 40
    
    # Generate JUnit reports
    - node tools/testing/tsc-junit.cjs type-check.log type-check-junit.xml || true
    - node tools/testing/tsc-junit.cjs type-check-tests.log type-check-tests-junit.xml || true
    
    # Exit with error if any check failed
    - |
      if [ "${TYPECHECK_EXIT:-0}" -ne 0 ] || [ "${TEST_TYPECHECK_EXIT:-0}" -ne 0 ] || [ "${RATCHET_EXIT:-0}" -ne 0 ]; then
        echo "❌ Type checking failed"
        exit 1
      fi
    - echo "✅ All type checks passed"
  artifacts:
    when: always
    paths:
      - type-check.log
      - type-check-tests.log
    reports:
      junit:
        - type-check-junit.xml
        - type-check-tests-junit.xml
    expire_in: 1 week
  <<: *rules-mr-and-main

# ==============================================================================
# SECURITY STAGE - Security scanning and vulnerability assessment
# ==============================================================================

secret-detection:
  stage: security
  image: $SECURE_ANALYZERS_PREFIX/secrets:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
  <<: *rules-mr-and-main

dependency-scanning:
  stage: security
  image: $SECURE_ANALYZERS_PREFIX/gemnasium:latest
  script:
    - /analyzer run
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  <<: *rules-mr-and-main

security-audit-frontend:
  extends: .node-base
  stage: security
  needs: ["install-dependencies"]
  script:
    - echo "🔒 Running frontend security audit..."
    - pnpm audit --audit-level moderate --json > frontend-audit.json || AUDIT_EXIT=$?
    - |
      if [ "${AUDIT_EXIT:-0}" -ne 0 ]; then
        echo "⚠️ Security vulnerabilities found in frontend dependencies"
        cat frontend-audit.json
        exit 1
      fi
    - echo "✅ Frontend security audit passed"
  artifacts:
    reports:
      junit: frontend-audit-junit.xml
    paths:
      - frontend-audit.json
    expire_in: 1 week
    when: always
  allow_failure: true
  <<: *rules-mr-and-main

security-audit-backend:
  extends: .python-base
  stage: security
  script:
    - echo "🔒 Running backend security audit..."
    - source .venv/bin/activate
    - pip install safety bandit
    
    - echo "Running safety check..."
    - safety check --json --output safety-report.json || SAFETY_EXIT=$?
    
    - echo "Running bandit security check..."
    - bandit -r . -f json -o bandit-report.json || BANDIT_EXIT=$?
    
    - |
      if [ "${SAFETY_EXIT:-0}" -ne 0 ] || [ "${BANDIT_EXIT:-0}" -ne 0 ]; then
        echo "⚠️ Security issues found in backend"
        [ -f safety-report.json ] && cat safety-report.json
        [ -f bandit-report.json ] && cat bandit-report.json
        exit 1
      fi
    - echo "✅ Backend security audit passed"
  artifacts:
    paths:
      - backend/safety-report.json
      - backend/bandit-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  <<: *rules-mr-and-main

# ==============================================================================
# TEST STAGE - Comprehensive testing with parallel execution
# ==============================================================================

test-backend:
  extends: .python-base
  stage: test
  needs: ["lint-backend"]
  services:
    - redis:7.0-alpine
  variables:
    REDIS_URL: "redis://redis:6379"
  script:
    - echo "🧪 Running backend tests..."
    - source .venv/bin/activate
    
    # Install test dependencies
    - pip install pytest pytest-cov pytest-xdist pytest-mock
    
    # Run tests with coverage
    - python -m pytest tests/ \
        --cov=astro \
        --cov-report=xml \
        --cov-report=html \
        --cov-report=term \
        --junitxml=junit.xml \
        -v \
        --tb=short \
        -x \
        --disable-warnings
    
    # Run slow tests separately
    - python -m pytest tests/ -m "slow" --tb=short || echo "Slow tests completed with warnings"
    
    - echo "✅ Backend tests completed"
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - backend/htmlcov/
      - backend/coverage.xml
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week
  <<: *rules-mr-and-main

test-frontend-astro:
  extends: .node-base
  stage: test
  needs: ["lint-frontend", "type-check"]
  script:
    - echo "🧪 Running Astro frontend tests..."
    - pnpm run test:astro -- --coverage --reporter=junit --outputFile=junit.xml
    - echo "🔍 Running accessibility tests..."
    - pnpm run test:a11y || echo "A11y tests completed with warnings"
    - echo "✅ Astro frontend tests completed"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - apps/astro/coverage/
    reports:
      junit: apps/astro/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/astro/coverage/cobertura-coverage.xml
    expire_in: 1 week
  <<: *rules-mr-and-main

test-frontend-healwave:
  extends: .node-base
  stage: test
  needs: ["lint-frontend", "type-check"]
  script:
    - echo "🧪 Running HealWave frontend tests..."
    - pnpm run test:healwave -- --coverage --reporter=junit --outputFile=junit.xml
    - echo "✅ HealWave frontend tests completed"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - apps/healwave/coverage/
    reports:
      junit: apps/healwave/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/healwave/coverage/cobertura-coverage.xml
    expire_in: 1 week
  <<: *rules-mr-and-main

test-packages:
  extends: .node-base
  stage: test
  needs: ["lint-frontend", "type-check"]
  script:
    - echo "🧪 Running package tests..."
    - pnpm run test:packages -- --coverage --reporter=junit --outputFile=packages-junit.xml
    - echo "✅ Package tests completed"
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    reports:
      junit: packages-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week
  <<: *rules-mr-and-main

# Integration tests
test-integration:
  extends: .node-base
  stage: test
  needs: ["test-backend", "test-frontend-astro"]
  services:
    - redis:7.0-alpine
  variables:
    REDIS_URL: "redis://redis:6379"
  script:
    - echo "🔗 Running integration tests..."
    - echo "Starting backend services..."
    - cd backend && source .venv/bin/activate && python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
    - sleep 10
    
    - echo "Running end-to-end tests..."
    - cd apps/astro && pnpm run test:e2e || echo "E2E tests completed"
    
    - echo "✅ Integration tests completed"
  artifacts:
    paths:
      - apps/astro/test-results/
    expire_in: 1 week
  allow_failure: true
  <<: *rules-mr-and-main

# ==============================================================================
# BUILD STAGE - Optimized builds with caching
# ==============================================================================

build-astro:
  extends: .node-base
  stage: build
  needs: ["test-frontend-astro"]
  script:
    - echo "🏗️ Building Astro frontend..."
    - cd apps/astro
    - echo "Building with optimizations..."
    - pnpm run build
    
    - echo "📊 Analyzing bundle size..."
    - pnpm run build:analyze || echo "Bundle analysis completed"
    
    - echo "✅ Astro build completed"
    - ls -la dist/
  artifacts:
    paths:
      - apps/astro/dist/
    reports:
      junit: apps/astro/build-report.xml
    expire_in: 1 week
  <<: *rules-main-only

build-healwave:
  extends: .node-base
  stage: build
  needs: ["test-frontend-healwave"]
  script:
    - echo "🏗️ Building HealWave frontend..."
    - cd apps/healwave
    - pnpm run build
    - echo "✅ HealWave build completed"
    - ls -la dist/
  artifacts:
    paths:
      - apps/healwave/dist/
    expire_in: 1 week
  <<: *rules-main-only

build-docker-images:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "🐳 Building Docker images..."
    
    # Build backend image
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    
    # Build astro frontend image
    - docker build -t $CI_REGISTRY_IMAGE/astro:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/astro:latest -f apps/astro/Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/astro:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/astro:latest
    
    - echo "✅ Docker images built and pushed"
  <<: *rules-main-only

# ==============================================================================
# DEPLOY STAGE - Environment-specific deployments
# ==============================================================================

deploy-astro-staging:
  extends: .node-base
  stage: deploy
  environment:
    name: staging
    url: https://cosmichub-astro-staging.vercel.app
  needs: ["build-astro"]
  script:
    - echo "🚀 Deploying Astro to staging..."
    - npm install -g vercel@latest
    - cd apps/astro
    - vercel deploy --token=$VERCEL_TOKEN --yes --scope $VERCEL_ORG_ID
    - echo "✅ Astro staging deployment completed"
  <<: *rules-mr-only

deploy-astro-production:
  extends: .node-base
  stage: deploy
  environment:
    name: production
    url: $ASTRO_PROD_URL
  needs: ["build-astro"]
  script:
    - echo "🚀 Deploying Astro to production..."
    - npm install -g vercel@latest
    - cd apps/astro
    - vercel deploy --prod --token=$VERCEL_TOKEN --yes --scope $VERCEL_ORG_ID
    - echo "✅ Astro production deployment completed"
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
  <<: *rules-main-only

deploy-backend-production:
  extends: .python-base
  stage: deploy
  environment:
    name: production
    url: $VITE_BACKEND_URL
  needs: ["test-backend"]
  script:
    - echo "🚀 Deploying backend to production..."
    - pip install requests
    
    # Trigger Render deployment
    - |
      DEPLOY_RESPONSE=$(curl -s -X POST \
        "https://api.render.com/deploy/srv-$RENDER_SERVICE_ID" \
        -H "Authorization: Bearer $RENDER_API_KEY" \
        -H "Content-Type: application/json" \
        -d '{}')
    
    - echo "Deploy response: $DEPLOY_RESPONSE"
    
    # Wait for deployment to complete
    - sleep 30
    
    # Health check
    - |
      for i in {1..10}; do
        if curl -f "$VITE_BACKEND_URL/health"; then
          echo "✅ Backend health check passed"
          break
        fi
        echo "Waiting for backend to be ready... ($i/10)"
        sleep 30
      done
    
    - echo "✅ Backend production deployment completed"
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
  <<: *rules-main-only

# ==============================================================================
# POST-DEPLOY STAGE - Monitoring and notifications
# ==============================================================================

post-deploy-smoke-tests:
  extends: .node-base
  stage: post-deploy
  needs: ["deploy-astro-production", "deploy-backend-production"]
  script:
    - echo "🔍 Running post-deployment smoke tests..."
    
    # Test backend health
    - curl -f "$VITE_BACKEND_URL/health" || { echo "❌ Backend health check failed"; exit 1; }
    
    # Test frontend accessibility
    - curl -f "$ASTRO_PROD_URL" || { echo "❌ Frontend accessibility check failed"; exit 1; }
    
    # Test API endpoints
    - curl -f "$VITE_BACKEND_URL/api/health" || { echo "❌ API health check failed"; exit 1; }
    
    - echo "✅ Smoke tests passed"
  retry:
    max: 3
    when: always
  <<: *rules-main-only

performance-monitoring:
  image: sitespeedio/sitespeed.io:latest
  stage: post-deploy
  needs: ["deploy-astro-production"]
  script:
    - echo "📊 Running performance monitoring..."
    - sitespeed.io --url $ASTRO_PROD_URL --budget budget.json --output /tmp/results
    - echo "✅ Performance monitoring completed"
  artifacts:
    paths:
      - /tmp/results/
    expire_in: 1 week
  allow_failure: true
  <<: *rules-main-only

# Generate deployment report
deployment-report:
  extends: .node-base
  stage: post-deploy
  needs: 
    - deploy-astro-production
    - deploy-backend-production
    - post-deploy-smoke-tests
  script:
    - echo "📋 Generating deployment report..."
    - |
      cat > deployment-report.md << EOF
      # Deployment Report - $(date)
      
      ## 🚀 Deployments
      - **Frontend (Astro)**: $ASTRO_PROD_URL
      - **Backend API**: $VITE_BACKEND_URL
      - **Commit**: $CI_COMMIT_SHA
      - **Pipeline**: $CI_PIPELINE_URL
      
      ## ✅ Status
      - Smoke tests: Passed
      - Health checks: Passed
      - Performance monitoring: Completed
      
      ## 📊 Metrics
      - Build time: $(date -d @$((CI_JOB_STARTED_AT)) '+%H:%M:%S')
      - Test coverage: Available in artifacts
      EOF
    - cat deployment-report.md
    - echo "✅ Deployment report generated"
  artifacts:
    paths:
      - deployment-report.md
    expire_in: 1 month
  <<: *rules-main-only
