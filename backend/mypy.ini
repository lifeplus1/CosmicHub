[mypy]
# Global options (less strict for gradual adoption)
python_version = 3.11
ignore_missing_imports = True
show_error_codes = True
pretty = True
explicit_package_bases = True
namespace_packages = True

# Start with basic checks
warn_unused_configs = True
warn_redundant_casts = True
warn_unreachable = True

# Gradually enable these as code improves:
# warn_unused_ignores = True
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# check_untyped_defs = True
# no_implicit_optional = True

allow_redefinition = True
strict_equality = False

# Exclude problematic modules during gradual migration
[mypy-astro.calculations.tcm_calculations]
ignore_errors = True

[mypy-astro.calculations.tcm_engine]
ignore_errors = True

[mypy-astro.calculations.tcm_schema]
ignore_errors = True

[mypy-astro.calculations.ayurveda_engine]
ignore_errors = True

[mypy-astro.calculations.ayurveda_schema]
ignore_errors = True

[mypy-utils.vectorized_monitoring]
ignore_errors = True

[mypy-utils.vectorized_composite_utils]
ignore_errors = True

[mypy-utils.vectorized_aspect_utils]
ignore_errors = True

[mypy-utils.vectorized_memory_optimization]
ignore_errors = True

[mypy-test_simple_debug]
ignore_errors = True

[mypy-test_rel012_firebase_auth]
ignore_errors = True

[mypy-test_debug]
ignore_errors = True

[mypy-test_integration]
