[mypy]
# Global options (less strict for gradual adoption)
python_version = 3.11
ignore_missing_imports = True
show_error_codes = True
pretty = True

# Start with basic checks
warn_unused_configs = True
warn_redundant_casts = True
warn_unreachable = True

# Gradually enable these as code improves:
# warn_unused_ignores = True
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# check_untyped_defs = True
# no_implicit_optional = True

allow_redefinition = False
strict_equality = True

# Per-module options - enable strict checking for specific files
[mypy-security.advanced_validation]
# This file is well-typed, enable stricter checking
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-security.csrf]
# CSRF protection is critical, enforce strict typing
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-security.abuse_detection]
# Security-critical file with good type coverage
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-backend.types.synastry_systems]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-backend.api.bridges.synastry_type_bridge]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-backend.analytics.custom_analytics]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[mypy-backend.analytics.websocket_handler]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True

# Skip TCM-related modules (being worked in parallel) to reduce noise
[mypy-backend.api.bridges.tcm_type_bridge]
ignore_errors = True

[mypy-backend.api.endpoints.tcm_systems]
ignore_errors = True

[mypy-backend.astro.calculations.tcm_calculations]
ignore_errors = True

[mypy-backend.types.tcm_mock_data]
ignore_errors = True

[mypy-backend.tests.test_tcm_systems]
ignore_errors = True

# For testing
[mypy-tests.*]
ignore_errors = True

# Third-party libraries
[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-swisseph.*]
ignore_missing_imports = True

[mypy-firebase_admin.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
